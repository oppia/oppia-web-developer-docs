name: Documentation CI

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs-ci.yml'

permissions:
  contents: read

jobs:
  custom-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run docs validation
        run: python scripts/check_docs.py